<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propostas — Roncolato Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0C0C0C;
            color: #FFFFFF;
            font-family: 'Jost', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* LOGIN SCREEN */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .login-screen.hidden {
            display: none;
        }

        .logo {
            width: 100%;
            max-width: 250px;
            margin-bottom: 20px;
        }

        .logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .login-title {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            letter-spacing: -1px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #7A7A7A;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #7A7A7A;
            font-weight: 600;
        }

        .form-group input {
            padding: 14px 16px;
            background: #141414;
            border: 1px solid rgba(255,255,255,0.07);
            color: #FFFFFF;
            font-family: 'Jost', sans-serif;
            font-size: 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #F5C518;
            background: #1a1a1a;
        }

        .form-group input::placeholder {
            color: #3A3A3A;
        }

        .btn {
            width: 100%;
            padding: 14px 16px;
            background: #F5C518;
            color: #0C0C0C;
            border: none;
            font-family: 'Jost', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .error {
            color: #FF6B6B;
            font-size: 12px;
            text-align: center;
        }

        /* LIST SCREEN */
        .list-screen {
            display: none;
            flex-direction: column;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body.has-list .container { max-width: 760px; }

        .list-screen.visible {
            display: flex;
            opacity: 1;
        }

        .list-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .list-subtitle {
            font-size: 14px;
            color: #7A7A7A;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .propostas-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .month-group { margin-top: 44px; }
        .month-group:first-child { margin-top: 20px; }
        .month-head {
            display: flex; align-items: baseline; gap: 14px;
            margin-bottom: 16px; padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .month-title {
            font-size: 12px; font-weight: 800; letter-spacing: 3px;
            text-transform: uppercase; color: #F5C518;
        }
        .month-count { font-size: 12px; color: #5A5A5A; letter-spacing: 1px; }

        /* ---- Status / CRM ---- */
        .status-bar {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
            margin: 6px 0 10px;
        }
        .filter-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.1);
            color: #8A8A8A; font-family: 'Jost', sans-serif; font-size: 11px;
            font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 8px 14px; border-radius: 999px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; transition: .2s;
        }
        .filter-btn:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
        .filter-btn.active { border-color: #F5C518; color: #F5C518; }
        .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #8A8A8A); }
        .filter-btn .cnt { color: #5A5A5A; font-weight: 500; }
        .summary {
            text-align: center; font-size: 12px; color: #5A5A5A;
            letter-spacing: 1px; margin-bottom: 8px;
        }
        .summary strong { color: #B4B4B4; font-weight: 600; }

        .proposta-card { position: relative; }
        .badge {
            position: absolute; top: 16px; right: 16px;
            font-size: 9px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase;
            padding: 5px 9px; border-radius: 999px;
            color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
            background: color-mix(in srgb, var(--c) 10%, transparent);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .proposta-card .proposta-name { padding-right: 110px; }
        .proposta-card.st-perdida { opacity: .45; }
        .proposta-card.st-perdida:hover { opacity: 1; }
        .proposta-card.st-aprovada { border-color: rgba(52,199,89,.35); }
        .proposta-card.st-negociacao { border-color: rgba(245,197,24,.35); }
        .proposta-value { font-size: 12px; color: #7A7A7A; margin-top: -8px; margin-bottom: 14px; }
        .proposta-value strong { color: #B4B4B4; font-weight: 600; }
        .month-group.hidden { display: none; }
        .badge { cursor: pointer; }
        .badge:hover { filter: brightness(1.3); }
        .foot-btns { display: flex; gap: 12px; }
        .foot-btns .logout-btn { flex: 1; }

        .proposta-card {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.07);
            padding: 24px;
            border-radius: 4px;
            text-decoration: none;
            color: #FFFFFF;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .proposta-card:hover {
            border-color: #F5C518;
            background: #1a1a1a;
            transform: translateY(-4px);
        }

        .proposta-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: capitalize;
        }

        .proposta-desc {
            font-size: 13px;
            color: #7A7A7A;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .proposta-link {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #F5C518;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .proposta-card:hover .proposta-link {
            gap: 8px;
        }

        .logout-btn {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #7A7A7A;
            font-family: 'Jost', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .logout-btn:hover {
            border-color: #F5C518;
            color: #F5C518;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }

            .login-title {
                font-size: 24px;
            }

            .list-title {
                font-size: 28px;
            }

            .propostas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div class="login-screen" id="loginScreen">
            <div class="logo">
                <img src="/assets/IMG/roncolato-branco-horizontal.png" alt="Roncolato">
            </div>
            <h1 class="login-title">Propostas</h1>
            <p class="login-subtitle">Acesso Restrito</p>

            <div style="width: 100%;">
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Digite a senha"
                        autocomplete="off"
                    >
                </div>
                <div id="error" class="error" style="margin-top: 10px;"></div>
                <button class="btn" onclick="checkPassword()" style="margin-top: 16px;">Acessar</button>
            </div>
        </div>

        <!-- LIST -->
        <div class="list-screen" id="listScreen">
            <div class="list-header">
                <h1 class="list-title">Propostas</h1>
                <p class="list-subtitle">Acesso Restrito</p>
            </div>

            <div class="status-bar" id="statusBar"></div>
            <div class="summary" id="summary"></div>
            <div id="propostas"></div>

            <div class="foot-btns">
                <button class="logout-btn" id="copyBtn" onclick="copyList()" title="Copia a lista com os status atuais para colar no index.html">Copiar lista</button>
                <button class="logout-btn" onclick="logout()">Sair</button>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD = 'rroncolato';
        const STORAGE_KEY = 'proposta_auth';

        // Lista de propostas — `month` no formato AAAA-MM (null = anteriores ao histórico).
        // A página agrupa por mês automaticamente, do mais recente ao mais antigo.
        // `status`: enviada | negociacao | aprovada | perdida | encerrada
        // `valor` (opcional, número): ex. valor: 15000 — entra na soma do topo.
        const propostas = [
            { id: 'jota-veiculos', name: 'Jota Veículos', desc: 'Direção de Marca & Conteúdo — Juvenildo Jr.', month: '2026-09', status: 'negociacao' },
            { id: 'vidal', name: 'Vidal Gestão Tributária', desc: 'Direção estratégica de marketing e comercial + marca pessoal dos sócios', month: '2026-09', status: 'negociacao' },
            { id: 'domo-imobiliario', name: 'Domo Imobiliário', desc: 'Fernando Aguiar — Marca + Identidade Visual', month: '2026-09', status: 'negociacao' },
            { id: 'stochos', name: 'Stochos', desc: 'Fundação de marca, direção de marketing e produto', month: '2026-08', status: 'aprovada' },
            { id: 'odonto-blink', name: 'Odonto Blink', desc: 'Rebranding — estratégia, identidade e site', month: '2026-07', status: 'perdida' },
            { id: 'dominio-ead', name: 'Domínio EAD', desc: 'Consultoria de Marketing — Retainer Mensal Dedicado', month: '2026-07', status: 'encerrada' },
            { id: 'rg-entulhos', name: 'RG Entulhos', desc: 'Usina de Reciclagem - Proposta Estratégica', month: '2026-07', status: 'aprovada' },
            { id: '41business', name: '41 Business', desc: 'Redesign de Marca + Landing Page', month: '2026-07', status: 'perdida' },
            { id: 'nova-alianca', name: 'Nova Aliança Empreendimentos', desc: 'Site corporativo — CarvalhoEnergia + HB20', month: '2026-07', status: 'negociacao' },
            { id: 'kero-mais', name: 'KERO+', desc: 'Proposta Estratégica', month: '2026-06', status: 'perdida' },
            { id: 'paula-ribeiro', name: 'Paula Ribeiro', desc: 'Proposta Comercial', month: '2026-06', status: 'encerrada' },
            { id: 'taruma', name: 'Taruma', desc: 'Proposta Comercial', month: null, status: 'encerrada' },
            { id: 'bemfast', name: 'BemFast', desc: 'Proposta Comercial', month: null, status: 'perdida' },
            { id: 'raro', name: 'Raro', desc: 'Proposta Comercial', month: null, status: 'encerrada' },
            { id: 'renata', name: 'Renata Rosa', desc: 'Proposta Comercial', month: null, status: 'perdida' },
            { id: 'unica', name: 'Unica Contábil', desc: 'Proposta Comercial', month: null, status: 'encerrada' },
            { id: 'fotografia-corporativa', name: 'Fotografia Corporativa', desc: 'Proposta de Serviço', month: null, status: 'enviada' }
        ];

        const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        function monthLabel(m) {
            if (!m) return 'Anteriores';
            const [y, mo] = m.split('-');
            return `${MESES[parseInt(mo, 10) - 1]} ${y}`;
        }

        function checkPassword() {
            const input = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            if (input === PASSWORD) {
                localStorage.setItem(STORAGE_KEY, 'true');
                errorDiv.textContent = '';
                showPropostas();
            } else {
                errorDiv.textContent = 'Senha incorreta. Tente novamente.';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        function logout() {
            localStorage.removeItem(STORAGE_KEY);
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('listScreen').classList.remove('visible');
            document.body.classList.remove('has-list');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }

        // Status (mini-CRM). Para atualizar: trocar o campo `status` na lista acima.
        // Campo opcional `valor` (número) soma no resumo do topo.
        const STATUS = {
            enviada:    { label: 'Enviada',    color: '#8A8A8A' },
            negociacao: { label: 'Negociação', color: '#F5C518' },
            aprovada:   { label: 'Aprovada',   color: '#34C759' },
            perdida:    { label: 'Perdida',    color: '#FF453A' },
            encerrada:  { label: 'Encerrada',  color: '#5AC8FA' }
        };
        const FILTER_KEY = 'proposta_filter';
        const OVERRIDE_KEY = 'proposta_status_override';
        let activeFilter = localStorage.getItem(FILTER_KEY) || 'todas';

        // Mudanças feitas pelo clique no badge ficam só neste navegador.
        // "Copiar lista" gera a lista atualizada para colar no arquivo e fixar no deploy.
        function loadOverrides() {
            try { return JSON.parse(localStorage.getItem(OVERRIDE_KEY) || '{}'); } catch { return {}; }
        }
        (function applyOverrides() {
            const o = loadOverrides();
            propostas.forEach(p => { if (o[p.id] && STATUS[o[p.id]]) p.status = o[p.id]; });
        })();

        function cycleStatus(id, ev) {
            ev.preventDefault(); ev.stopPropagation();
            const p = propostas.find(x => x.id === id);
            const keys = Object.keys(STATUS);
            p.status = keys[(keys.indexOf(p.status) + 1) % keys.length];
            const o = loadOverrides(); o[id] = p.status;
            localStorage.setItem(OVERRIDE_KEY, JSON.stringify(o));
            renderList();
        }

        function copyList() {
            const q = v => `'${String(v).replace(/'/g, "\\'")}'`;
            const lines = propostas.map(p =>
                `            { id: ${q(p.id)}, name: ${q(p.name)}, desc: ${q(p.desc)}, month: ${p.month ? q(p.month) : 'null'}, status: ${q(p.status)}${p.valor ? `, valor: ${p.valor}` : ''} }`
            );
            const txt = `        const propostas = [\n${lines.join(',\n')}\n        ];`;
            navigator.clipboard.writeText(txt).then(() => {
                const b = document.getElementById('copyBtn'); b.textContent = 'Copiado — cole no index.html';
                setTimeout(() => b.textContent = 'Copiar lista', 2500);
            });
        }

        const brl = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

        function setFilter(f) {
            activeFilter = f;
            localStorage.setItem(FILTER_KEY, f);
            renderList();
        }

        function renderStatusBar() {
            const counts = {};
            propostas.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
            const btn = (key, label, color, n) => `
                <button class="filter-btn ${activeFilter === key ? 'active' : ''}" style="--c:${color}" onclick="setFilter('${key}')">
                    ${color ? '<span class="dot"></span>' : ''}${label}<span class="cnt">${n}</span>
                </button>`;
            document.getElementById('statusBar').innerHTML =
                btn('todas', 'Todas', '', propostas.length) +
                Object.entries(STATUS).map(([k, s]) => btn(k, s.label, s.color, counts[k] || 0)).join('');

            const soma = (st) => propostas.filter(p => p.status === st && p.valor).reduce((a, p) => a + p.valor, 0);
            const aberto = soma('enviada') + soma('negociacao');
            const fechado = soma('aprovada') + soma('encerrada');
            const parts = [];
            if (aberto) parts.push(`<strong>${brl(aberto)}</strong> em aberto`);
            if (fechado) parts.push(`<strong>${brl(fechado)}</strong> fechado`);
            document.getElementById('summary').innerHTML = parts.join(' · ');
        }

        function renderList() {
            renderStatusBar();

            const card = p => {
                const st = STATUS[p.status] || STATUS.enviada;
                return `
                <a href="/proposta/${p.id}" class="proposta-card st-${p.status}">
                    <span class="badge" style="--c:${st.color}" title="Clique para mudar o status" onclick="cycleStatus('${p.id}', event)">${st.label}</span>
                    <div>
                        <div class="proposta-name">${p.name}</div>
                        <div class="proposta-desc">${p.desc}</div>
                        ${p.valor ? `<div class="proposta-value"><strong>${brl(p.valor)}</strong></div>` : ''}
                    </div>
                    <div class="proposta-link">Acessar →</div>
                </a>`;
            };

            const visiveis = activeFilter === 'todas' ? propostas : propostas.filter(p => p.status === activeFilter);

            // Agrupa por mês; meses com data vêm primeiro (mais recente no topo), "Anteriores" por último
            const groups = new Map();
            visiveis.forEach(p => {
                const key = p.month || '';
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(p);
            });
            const keys = [...groups.keys()].sort((a, b) => {
                if (!a) return 1;
                if (!b) return -1;
                return b.localeCompare(a);
            });

            const grid = document.getElementById('propostas');
            grid.innerHTML = keys.map(k => {
                const items = groups.get(k);
                return `
                <div class="month-group">
                    <div class="month-head">
                        <span class="month-title">${monthLabel(k || null)}</span>
                        <span class="month-count">${items.length} ${items.length === 1 ? 'proposta' : 'propostas'}</span>
                    </div>
                    <div class="propostas-grid">${items.map(card).join('')}</div>
                </div>`;
            }).join('') || '<div class="summary" style="margin-top:30px">Nenhuma proposta com esse status.</div>';
        }

        function showPropostas() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('listScreen').classList.add('visible');
            document.body.classList.add('has-list');
            renderList();
        }

        // Check if already authenticated
        window.addEventListener('load', () => {
            if (localStorage.getItem(STORAGE_KEY) === 'true') {
                showPropostas();
            } else {
                document.getElementById('password').focus();
            }
        });

        // Allow Enter key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginScreen').classList.length === 0) {
                checkPassword();
            }
        });
    </script>
</body>
</html>
